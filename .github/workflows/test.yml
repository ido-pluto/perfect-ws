name: Test
on: [ push ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install modules
        run: npm ci --ignore-scripts
      - name: TypeScript validity
        run: npm run build
      - name: Run Tests
        run: npm run test
